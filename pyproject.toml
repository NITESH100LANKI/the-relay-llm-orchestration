[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "the-relay"
version = "1.0.0"
description = "Production-Grade LLM Orchestration, RAG & Performance Engineering System"
readme = "README.md"
authors = [{ name = "Senior AI/ML Systems Engineer" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "groq>=0.9.0",
    "pymupdf>=1.23.0",
    "rank-bm25>=0.2.2",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "reportlab>=4.1.0"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "reportlab>=4.1.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
pythonpath = ["."]

[tool.vercel]
entrypoint = "app.api.server:app"
